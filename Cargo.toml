[package]
name = "aw"
description = "Agentic Workspace: An opinionated tool for working with agent harnesses"
authors = ["Evan Pratten <evan@ewpratten.com>"]
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
fern = "0.7.1"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
directories = "6.0.0"
shellexpand = "3.1.2"
toml = "1.1.6"
serde_json = { version = "1", features = ["preserve_order"] }

